services:
  anime:
    container_name: anime-expansion
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    networks:
      - proxy-net

    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy-net'
      - 'traefik.http.routers.anime.rule=Host(`anime.nicksforge.dev`)'
      - 'traefik.http.routers.anime.entrypoints=public-tunnel'
      - 'traefik.http.services.anime.loadbalancer.server.port=80'

networks:
  proxy-net:
    external: true
